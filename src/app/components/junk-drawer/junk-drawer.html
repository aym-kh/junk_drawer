<div class="drawer-container" [class.open]="isOpen()" [class.overstuffed]="isOverstuffed()">
    <!-- Top surface of the desk / drawer header where mug/plant items sit -->
    <div class="drawer-top-surface" (click)="toggleDrawer()">
        <div class="drawer-handle"></div>
    </div>

    <!-- The sliding interior body where physics icons live -->
    <div class="drawer-body">
        <app-canvas-physics [drawerOpen]="isOpen()"></app-canvas-physics>
    </div>
</div>
