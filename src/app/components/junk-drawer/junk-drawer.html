<div class="drawer-container" [class.open]="isOpen()" [class.overstuffed]="isOverstuffed()">
    <div class="drawer-surface" (click)="toggleDrawer()">
        <div class="drawer-surface-handle"></div>
        <div class="drawer-surface-edge"></div>
        <div class="drawer-surface-wall"></div>
    </div>
    <div class="drawer-body">
        <!-- LEFT WALLL OF THE DRAWER -->
        <div class="drawer-surface-2">
            <div class="drawer-surface-2-edge"></div>
            <div class="drawer-surface-2-wall"></div>
        </div>

        <div class="drawer-floor">
            <app-canvas-physics [drawerOpen]="isOpen()"></app-canvas-physics>
        </div>

        <!-- RIGHT WALLL OF THE DRAWER -->
        <div class="drawer-surface-3">
            <div class="drawer-surface-3-wall"></div>
            <div class="drawer-surface-3-edge"></div>
        </div>
    </div>
</div>
