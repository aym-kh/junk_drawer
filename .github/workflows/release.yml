name: Beta release

on:
  push:
    tags:
      - '*-beta*'

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: '--bundles nsis'
          - name: macOS (Apple silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Junk Drawer ${{ github.ref_name }}
          releaseBody: Beta installers for Windows and macOS. See the assets below to download.
          prerelease: true
          args: ${{ matrix.args }}
